<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fabulous 55 • Birthday Lounge</title><meta name="theme-color" content="#080d20">
<style>
:root{--gold:#ffe49a;--cream:#fff9eb;--hot:#e8b6d0;--cool:#89d5f2}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Georgia,"Times New Roman",serif;background:#080d20;color:var(--cream)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.background{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 12%,#02061599 75%),linear-gradient(120deg,#100b27a8,#050d218c 55%,#150825a8);pointer-events:none}
.background:after{content:"";position:absolute;inset:0;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 4px);mix-blend-mode:overlay}
.stage{position:fixed;inset:1.6vh 2.2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1.5px solid #f5df8c77;border-radius:30px;box-shadow:inset 0 0 38px #f4d88018,0 0 42px #10092470;pointer-events:none;padding:2vh 2vw}
.stage:before,.stage:after{content:"";position:absolute;inset:12px;border:1px solid #ffffe32c;border-radius:23px;pointer-events:none}
.stage:after{inset:22px;border-color:#ffffee16}
.corner{position:absolute;width:clamp(25px,5vw,80px);height:clamp(25px,5vw,80px);border-color:#ffe6ad;border-style:solid;opacity:.82}
.tl{left:25px;top:25px;border-width:3px 0 0 3px}.tr{right:25px;top:25px;border-width:3px 3px 0 0}.bl{bottom:25px;left:25px;border-width:0 0 3px 3px}.br{bottom:25px;right:25px;border-width:0 3px 3px 0}
.header{font-family:Arial,sans-serif;font-size:clamp(12px,1.4vw,25px);letter-spacing:.48em;font-weight:700;color:#fff8dd;text-transform:uppercase;text-shadow:0 0 20px #ecd6a5;animation:reveal .9s both}
.headline{font-size:clamp(48px,7vw,122px);line-height:.97;margin:1.2vh 0 0;font-weight:normal;letter-spacing:-.035em;color:#fffbea;text-shadow:0 0 22px #d8a9688c,0 3px 10px #000;animation:float 4.8s ease-in-out infinite}
.number-wrap{display:flex;align-items:center;justify-content:center;width:min(90vw,1200px);overflow:visible}.number{position:relative;font-family:Georgia,serif;font-size:clamp(90px,min(18vw,27vh),270px);font-weight:700;letter-spacing:-.055em;line-height:1.18;padding:.09em .13em .18em .08em;margin:0;color:#ffeeb4;background:linear-gradient(145deg,#fffef0,#fbe6a1 27%,#ae7940 46%,#fff6d1 63%,#c99644 87%,#fffde5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 32px #fff2ad48) drop-shadow(0 8px 0 #60411d);animation:float 4.8s ease-in-out infinite, shimmer 5.4s linear infinite}
.subtitle{font:700 clamp(18px,2.6vw,43px) Arial,sans-serif;letter-spacing:.32em;color:#fff7e6;text-shadow:0 0 13px #f4c79f;max-width:90vw;text-transform:uppercase}
.line{width:min(46vw,600px);height:2px;margin:3vh 0;background:linear-gradient(90deg,transparent,#ffe2a6,transparent);box-shadow:0 0 15px #f6c971}
.message{font:400 clamp(20px,2.7vw,48px) Georgia,serif;font-style:italic;color:#fff9e6;text-shadow:0 0 12px #e7c88e;min-height:1.4em;transition:opacity .7s,transform .7s;max-width:90vw}
.message.out{opacity:0;transform:translateY(12px)}
.bottom{position:absolute;bottom:4.5vh;font:700 clamp(12px,1.15vw,20px) Arial,sans-serif;letter-spacing:.34em;color:#fef0c8;text-transform:uppercase}
.orb{position:fixed;left:50%;top:50%;width:60vw;height:60vw;transform:translate(-50%,-50%);border:1px solid #ffe5ae25;border-radius:50%;box-shadow:0 0 70px #e3c48b1f;animation:orbit 28s linear infinite;pointer-events:none}
.orb:before,.orb:after{content:"";position:absolute;inset:7%;border-radius:50%;border:1px dashed #efdeaa1e}
.orb:after{inset:20%;border:2px solid #f1d29510}
.controls{position:fixed;right:16px;top:15px;z-index:10;display:flex;gap:8px;align-items:center;font:600 14px Arial,sans-serif;opacity:.12;transition:opacity .25s;flex-wrap:wrap;justify-content:flex-end;max-width:min(85vw,750px)}
.controls:hover,.controls:focus-within{opacity:1}.controls button,.controls select{font:700 14px Arial,sans-serif;border:1px solid #ffe7ab99;border-radius:9px;background:#11182de6;color:#fff;padding:10px 12px;cursor:pointer}.controls button:focus-visible,.controls select:focus-visible{outline:3px solid white}
.disco .stage{border-color:#edb8ff83}.disco .number{filter:drop-shadow(0 0 55px #fd84e5ad)}.disco .subtitle{color:#ffbaf0}.disco .header{color:#ffc5ed}
.classic .stage{border-color:#cde5ff99}.classic .number{filter:drop-shadow(0 0 42px #91d9ff70)}
.hint{position:fixed;left:18px;bottom:12px;z-index:8;font:12px Arial,sans-serif;color:#ffffff88;opacity:0;animation:hint 5s ease-out 1}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.02)}}@keyframes shimmer{0%,100%{filter:drop-shadow(0 0 22px #fff2ad48) drop-shadow(0 8px 0 #60411d)}50%{filter:drop-shadow(0 0 40px #fff4bb8a) drop-shadow(0 8px 0 #60411d)}}@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes reveal{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@keyframes hint{0%,80%{opacity:.7}100%{opacity:0}}
@media(max-width:700px){.stage{inset:2vh 2vw}.headline{font-size:clamp(42px,10vw,80px)}.number{font-size:clamp(80px,min(25vw,24vh),180px);line-height:1.18;padding-bottom:.2em}.header{letter-spacing:.2em}.subtitle{letter-spacing:.1em}.controls{opacity:.28}.bottom{letter-spacing:.1em}}
@media(prefers-reduced-motion:reduce){.headline,.number,.orb,.header{animation:none}}
.number-wrap{flex:0 0 auto;min-height:0;overflow:visible}.number{overflow:visible;white-space:nowrap}.stage{overflow:visible}</style></head>
<body class="lounge">
<canvas id="ambient" aria-hidden="true"></canvas><div class="background"></div><div class="orb"></div>
<main class="stage" aria-label="Fabulous 55 birthday celebration">
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="header">Tonight We Celebrate</div>
<div class="headline">Fabulous</div><div class="number-wrap"><div class="number">55</div></div>
<div class="subtitle">Happy Birthday, Mom!</div><div class="line"></div>
<div class="message" id="message">A night to remember ✦</div>
<div class="bottom">Love • Laughter • Memories</div>
</main>
<nav class="controls" aria-label="Display controls">
<select id="theme" title="Animation style"><option value="lounge">✨ Golden lounge</option><option value="disco">🪩 Disco lights</option><option value="classic">🌌 Starry night</option></select>
<button id="fullscreen" title="Fullscreen (F)">⛶ Fullscreen</button>
<button id="pause" title="Pause motion (space)">⏸ Pause</button>
<button id="hide" title="Hide buttons (H)">Hide controls</button>
<a href="host.html" style="color:#fff;text-decoration:none;font:700 13px Arial,sans-serif;background:#101c35;padding:10px;border:1px solid #ffe3a566;border-radius:8px">Game host</a>
</nav><div class="hint">Press F for fullscreen • H to hide controls • Space to pause • 1/2/3 to change scene</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('ambient'),ctx=canvas.getContext('2d',{alpha:false}),root=document.body;
const theme=document.getElementById('theme'),pauseBtn=document.getElementById('pause'),controls=document.querySelector('.controls');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let width=1,height=1,dpr=1,particles=[],beams=[],rings=[],comets=[],tick=0,last=0,paused=reduced;
const messages=["A night to remember ✦","55 years of love & laughter","The queen of the celebration","Here's to beautiful memories","Shine bright, birthday star","Cheers to 55 fabulous years","Family, music & good times"];
const message=document.getElementById('message');let messageIndex=0;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);width=innerWidth;height=innerHeight;
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const n=Math.min(260,Math.max(90,Math.round(width*height/6800)));
  particles=Array.from({length:n},()=>({
    x:Math.random()*width,y:Math.random()*height,r:Math.random()*3.3+.4,
    vx:(Math.random()-.5)*.8,vy:-(Math.random()*.65+.08),
    a:Math.random()*.8+.15,phase:Math.random()*7,twinkle:Math.random()*.022+.007
  }));
  beams=Array.from({length:10},(_,i)=>({angle:(i/10)*Math.PI*2,speed:(i%2?1:-1)*(.00028+Math.random()*.00032),width:.16+Math.random()*.18}));rings=Array.from({length:5},(_,i)=>({radius:Math.min(width,height)*(.18+i*.08),speed:.00012+i*.00003,alpha:.04+i*.015}));comets=Array.from({length:5},()=>spawnComet());
}
function spawnComet(){const side=Math.random();return{x:side<.5?-80:Math.random()*width,y:side<.5?Math.random()*height:-60,vx:1.6+Math.random()*2.4,vy:1.2+Math.random()*1.6,len:70+Math.random()*80,a:.22+Math.random()*.22}}addEventListener('resize',resize);resize();
function draw(now){
  if(!paused&&(!last||now-last>12)){
    tick+=Math.min((now-last||16),50);last=now;
    const disco=theme.value==='disco',classic=theme.value==='classic';
    const grd=ctx.createRadialGradient(width*.5,height*.5,30,width*.5,height*.53,Math.max(width,height)*.75);
    if(disco){grd.addColorStop(0,'#54266b');grd.addColorStop(.55,'#170d38');grd.addColorStop(1,'#070717')}
    else if(classic){grd.addColorStop(0,'#163a60');grd.addColorStop(.5,'#0b1c38');grd.addColorStop(1,'#030914')}
    else{grd.addColorStop(0,'#35304a');grd.addColorStop(.5,'#14172d');grd.addColorStop(1,'#070b1a')}
    ctx.fillStyle=grd;ctx.fillRect(0,0,width,height);
    ctx.save();ctx.translate(width/2,height/2);
    const radius=Math.max(width,height);
    beams.forEach((b,i)=>{
      const angle=b.angle+tick*b.speed;const hue=disco?([315,185,45,275,195,350,55,170,300,220][i]):classic?200:40;
      const alpha=disco?.13:(classic?.06:.07);
      ctx.rotate(angle);const g=ctx.createLinearGradient(0,0,0,-radius);
      g.addColorStop(0,'hsla('+hue+',95%,78%,0)');
      g.addColorStop(.45,'hsla('+hue+',95%,78%,'+alpha+')');
      g.addColorStop(1,'hsla('+hue+',95%,78%,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-radius*b.width,-radius);ctx.lineTo(radius*b.width,-radius);ctx.closePath();ctx.fill();ctx.rotate(-angle);
    });rings.forEach((r,i)=>{ctx.strokeStyle='rgba(255,232,185,'+(r.alpha+.02*Math.sin(tick*r.speed+i))+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,r.radius+10*Math.sin(tick*r.speed*1.7+i),0,Math.PI*2);ctx.stroke()});ctx.restore();
    particles.forEach((p,i)=>{
      p.x+=p.vx*(disco?2.1:1.2);p.y+=p.vy*(disco?1.3:1.05);
      if(p.y< -8)p.y=height+8;if(p.x<-8)p.x=width+8;if(p.x>width+8)p.x=-8;
      const alpha=p.a*(.65+.35*Math.sin(tick*p.twinkle+p.phase));
      const hue=disco?([48,305,190,260][i%4]):classic?210:44;
      ctx.fillStyle='hsla('+hue+',98%,85%,'+alpha+')';
      ctx.shadowBlur=p.r*5;ctx.shadowColor='hsla('+hue+',90%,75%,.8)';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    });ctx.shadowBlur=0;
    comets.forEach((v,i)=>{v.x+=v.vx*(disco?1.15:1);v.y+=v.vy*(disco?1.1:1);if(v.x>width+120||v.y>height+120)comets[i]=spawnComet();const trail=ctx.createLinearGradient(v.x,v.y,v.x-v.len,v.y-v.len*.58);trail.addColorStop(0,'rgba(255,255,255,'+v.a+')');trail.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=trail;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(v.x,v.y);ctx.lineTo(v.x-v.len,v.y-v.len*.58);ctx.stroke();ctx.fillStyle='rgba(255,247,210,'+(v.a+.2)+')';ctx.beginPath();ctx.arc(v.x,v.y,2.8,0,Math.PI*2);ctx.fill()});
    if(disco){
      for(let i=0;i<3;i++){
        const x=width*(.2+i*.3)+Math.sin(tick*.00034+i)*width*.06;
        const y=height*.18+Math.cos(tick*.0005+i)*height*.12;
        const g=ctx.createRadialGradient(x,y,0,x,y,width*.22);
        g.addColorStop(0,['#f14cd438','#39dbf43b','#ffc84837'][i]);
        g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
      }
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function setPause(v){paused=v;pauseBtn.textContent=v?'▶ Resume':'⏸ Pause';if(!v)last=0}
pauseBtn.onclick=()=>setPause(!paused);
document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();
document.getElementById('hide').onclick=()=>{controls.style.display='none'};
theme.onchange=()=>{root.className=theme.value};
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F')document.getElementById('fullscreen').click();
  if(e.key==='h'||e.key==='H')controls.style.display=controls.style.display==='none'?'flex':'none';
  if(e.code==='Space'){e.preventDefault();setPause(!paused)}
  if(['1','2','3'].includes(e.key)){theme.value=['lounge','disco','classic'][Number(e.key)-1];theme.onchange()}
});
setInterval(()=>{if(paused)return;message.classList.add('out');setTimeout(()=>{messageIndex=(messageIndex+1)%messages.length;message.textContent=messages[messageIndex];message.classList.remove('out')},750)},6500);
})();
</script></body></html>

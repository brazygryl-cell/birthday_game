<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Family Feud | TV Display</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#061632;color:white}
body{font-family:Arial,Helvetica,sans-serif}
#tv{width:100%;height:100vh;height:100dvh;padding:1.8vh 2vw;display:grid;grid-template-rows:minmax(0,17fr) minmax(0,7fr) minmax(0,76fr);gap:1vh}
.scores{display:grid;grid-template-columns:1fr .7fr 1fr;gap:1vw;min-height:0}
.score{min-width:0;border:3px solid #ffe08a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0e326d;padding:.2vh .5vw}
.score label{font:900 clamp(13px,2.5vh,32px)/1.05 Arial,sans-serif;max-width:100%;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.score strong{font:900 clamp(28px,7vh,80px)/1 Impact,'Arial Black',sans-serif;color:#ffebaa}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1vw;min-height:0}
.pill{font:900 clamp(13px,2.7vh,27px)/1 Arial,sans-serif;border-radius:10px;background:#ffe18c;color:#052251;padding:.8vh 1vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn{text-align:center;font:900 clamp(14px,2.8vh,31px)/1 Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font:900 clamp(22px,4.5vh,49px)/1 Impact,'Arial Black',sans-serif;background:#0e326d;border:2px solid white;border-radius:9px;padding:.4vh 1.1vw;min-width:0;text-align:center}
.clock.warning{background:#a10d29;animation:pulse .5s infinite alternate}
.board{height:100%;min-height:0;border:5px solid #ffe08a;border-radius:16px;background:linear-gradient(160deg,#1658ae,#08275c);padding:1vh 1.3vw;display:grid;grid-template-rows:minmax(0,6fr) minmax(0,15fr) minmax(0,70fr) minmax(0,9fr);gap:.6vh;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;min-height:0;font:900 clamp(13px,2.7vh,29px)/1 Impact,'Arial Black',sans-serif;color:#fff2bd}
.question{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;text-align:center;font:900 clamp(18px,3.65vh,42px)/1.05 Impact,'Arial Black',sans-serif;padding:0 .4vw}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.9vh .85vw;min-height:0;height:100%}
.answer{display:flex;min-height:0;min-width:0;align-items:center;justify-content:center;gap:.7vw;border:2px solid #dfefff;border-radius:9px;background:linear-gradient(#1351a4,#082958);overflow:hidden;padding:.4vh .6vw;font:900 clamp(19px,3.8vh,42px)/1 Impact,'Arial Black',sans-serif}
.num{flex:0 0 auto;display:grid;place-items:center;width:clamp(29px,5.8vh,59px);height:clamp(29px,5.8vh,59px);border-radius:50%;background:#ffdf80;color:#071d47;border:2px solid white;font:900 clamp(17px,3.4vh,37px)/1 Impact,'Arial Black',sans-serif}
.answer.open{background:#fff;color:#082551;border-color:#ffe08a;justify-content:space-between;animation:reveal .3s ease-out}
.answer.open .num{background:#0c397c;color:white}
.answer .text{min-width:0;overflow:hidden;line-height:1.06;font:900 clamp(14px,2.9vh,31px)/1.06 Arial,sans-serif;overflow-wrap:anywhere}
.pts{flex:0 0 auto;min-width:clamp(30px,4vw,64px);padding:.5vh .4vw;background:#0c397c;color:white;text-align:center;border-radius:5px;font:900 clamp(17px,3.3vh,38px)/1 Impact,'Arial Black',sans-serif}
.strikes{display:flex;align-items:center;justify-content:center;gap:2vw;min-height:0}
.strikes span{font:900 clamp(23px,5.5vh,58px)/1 Impact,'Arial Black',sans-serif;color:#91acd2}
.strikes span.on{color:#ff405d;text-shadow:0 0 10px #ff506f}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#020b1edb;z-index:100;font:900 clamp(55px,12vw,180px)/1 Impact,'Arial Black',sans-serif;color:#ffe18a;text-shadow:0 4px #87581e;padding:5vw;pointer-events:none}
#overlay.show{display:flex}
#overlay.wrong{color:#ff425a}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:101}
.bit{position:absolute;top:-25px;width:9px;height:15px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(700deg)}}
@keyframes pulse{to{filter:brightness(1.5)}}
@keyframes reveal{from{transform:rotateX(65deg)}to{transform:rotateX(0)}}
@media(max-height:540px){
 #tv{padding:.8vh 1vw;gap:.6vh;grid-template-rows:minmax(0,15fr) minmax(0,7fr) minmax(0,78fr)}
 .board{border-width:3px;padding:.5vh 1vw;gap:.25vh}
 .score{border-width:2px}
 .answer{border-width:1px}
 .answer .text{font-size:clamp(12px,2.6vh,22px)}
}
</style></head>
<body>
<div id="tv">
<section class="scores"><div class="score"><label id="n0">TEAM A</label><strong id="s0">0</strong></div><div class="score"><label>ROUND POINTS</label><strong id="pot">0</strong></div><div class="score"><label id="n1">TEAM B</label><strong id="s1">0</strong></div></section>
<div class="mini"><span class="pill" id="phase">FACE-OFF</span><span class="turn" id="turn">BUZZ IN TO START</span><span class="clock" id="timer">00:20</span></div>
<main class="board"><div class="bar"><span id="round">ROUND 1</span><span id="multi">SINGLE POINTS</span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="strikes" id="strikes"><span>✕</span><span>✕</span><span>✕</span></div></main>
</div><div id="overlay"></div><div id="confetti"></div>
<script>
const data=[{"q":"Name something a guest might quietly do after tasting a dish they dislike.","a":[["Push it around the plate",32],["Say they're full",25],["Drink something",17],["Throw it away discreetly",12],["Offer it to someone else",9],["Cover it with another food",5]]},{"q":"Name a family argument that starts with 'That's not how it happened.'","a":[["Childhood memory",32],["Who started it",25],["Old relationship story",17],["Who paid",12],["Family vacation",9],["Who broke something",5]]},{"q":"Name a reason someone may suddenly leave the family group chat.","a":[["Too much drama",32],["Too many notifications",25],["Felt targeted",17],["Political argument",12],["Spoiled surprise",9],["Wrong message",5]]},{"q":"Name something an adult still calls Mom to ask how to do.","a":[["Cook a recipe",32],["Remove a stain",25],["Handle a bill",17],["Find a document",12],["Parenting advice",9],["Fix something",5]]},{"q":"Name a sign someone is pretending to enjoy a party.","a":[["Checks phone",32],["Fake smile",25],["Looks at clock",17],["Stays near door",12],["Says they're tired",9],["Avoids conversation",5]]},{"q":"Name something that seems fine until you have 25 guests.","a":[["Not enough seating",32],["Bathroom line",25],["Parking",17],["Wi-Fi",12],["Ice supply",9],["Serving utensils",5]]},{"q":"Name an excuse people use when late but don't want to admit why.","a":[["Traffic",32],["Lost keys",25],["Stopped for gas",17],["Outfit emergency",12],["Lost track of time",9],["Picked someone up",5]]},{"q":"Name a sign someone is about to start gossiping.","a":[["Leans closer",32],["Lowers voice",25],["Looks around",17],["Says don't tell",12],["Closes door",9],["Starts with girl",5]]},{"q":"Name something guests remember about a party a year later.","a":[["Family drama",32],["Amazing food",25],["Someone dancing",17],["Birthday speech",12],["Funny outfit",9],["Unexpected guest",5]]},{"q":"Name an occasion when a family member acts like the expert.","a":[["Cooking",32],["Directions",25],["Raising kids",17],["Home repairs",12],["Money advice",9],["Party planning",5]]},{"q":"Name something people claim not to care about but secretly do.","a":[["Guest list",32],["Birthday gifts",25],["Social media likes",17],["Seating",12],["Who's dating whom",9],["Being in photos",5]]},{"q":"Name something that makes a family recipe hard to recreate.","a":[["No measurements",32],["Secret ingredient",25],["Cooking by instinct",17],["Different ingredients",12],["Special pan",9],["Years of practice",5]]},{"q":"Name why a guest might unexpectedly become the center of attention.","a":[["Big announcement",32],["Outfit",25],["Argument",17],["Starts dancing",12],["Proposal",9],["Funny story",5]]},{"q":"Name a situation where someone says 'Don't tell your mother.'","a":[["Broke something",32],["Expensive purchase",25],["Secret outing",17],["Bad grade",12],["Surprise gift",9],["Family gossip",5]]},{"q":"Name something someone packs as leftovers that wasn't on their plate.","a":[["Extra meat",32],["Dessert",25],["Mac and cheese",17],["Bread",12],["Sauce",9],["Food for someone home",5]]},{"q":"Name something at a gathering that exposes a long-kept family secret.","a":[["Old photos",32],["Auntie's story",25],["Family tree",17],["Phone message",12],["A toast",9],["Unexpected visitor",5]]},{"q":"Name a moment when family members suddenly become competitive.","a":[["Card games",32],["Trivia",25],["Cooking contest",17],["Karaoke",12],["Dancing",9],["Board games",5]]},{"q":"Name something people only admit after hours at a party.","a":[["They were upset",32],["Dislike a dish",25],["Want to leave",17],["Knew the secret",12],["Dating someone",9],["Exhausted",5]]},{"q":"Name what can turn a quick visit into an all-night stay.","a":[["Great conversation",32],["Good food",25],["Card game",17],["Music",12],["Family stories",9],["Surprise guest",5]]},{"q":"Name something a grown child still gets scolded about at Mom's house.","a":[["Leaving dishes",32],["Not calling",25],["Shoes on furniture",17],["Being late",12],["Wasting food",9],["Messy room",5]]}];
const key='birthdayFamilyFeud1',$=id=>document.getElementById(id);
const blank=()=>({r:0,sc:[0,0],names:['Team A','Team B'],revealed:{},strikes:0,phase:'FACE-OFF',turn:-1,clock:{duration:20,remaining:20,running:false,ends:0}});
let s=blank(),hideOverlay;
try{const raw=JSON.parse(localStorage.getItem(key));if(raw&&Array.isArray(raw.sc))s={...blank(),...raw}}catch(e){}
function render(){
 const r=Math.max(0,Math.min(data.length-1,Number(s.r)||0)),round=data[r];
 const seen=Array.isArray(s.revealed?.[r])?s.revealed[r]:[];
 $('n0').textContent=s.names?.[0]||'Team A';$('n1').textContent=s.names?.[1]||'Team B';
 $('s0').textContent=s.sc?.[0]||0;$('s1').textContent=s.sc?.[1]||0;
 const mult=r>=14?3:r>=9?2:1;
 $('pot').textContent=round.a.reduce((t,a,i)=>t+(seen.includes(i)?a[1]*mult:0),0);
 $('phase').textContent=s.phase||'FACE-OFF';
 $('turn').textContent=s.turn===0?(s.names?.[0]||'TEAM A')+' HAS CONTROL':s.turn===1?(s.names?.[1]||'TEAM B')+' HAS CONTROL':'BUZZ IN TO START';
 $('round').textContent='ROUND '+(r+1)+' / '+data.length;
 $('multi').textContent=['SINGLE','DOUBLE','TRIPLE'][mult-1]+' POINTS';
 $('question').textContent=round.q;
 const fragment=document.createDocumentFragment();
 round.a.forEach(([answer,points],i)=>{
   const cell=document.createElement('div');cell.className='answer'+(seen.includes(i)?' open':'');
   const num=document.createElement('span');num.className='num';num.textContent=i+1;cell.append(num);
   if(seen.includes(i)){const txt=document.createElement('span');txt.className='text';txt.textContent=answer;const pts=document.createElement('span');pts.className='pts';pts.textContent=points*mult;cell.append(txt,pts)}
   fragment.append(cell);
 });
 $('answers').replaceChildren(fragment);
 [...$('strikes').children].forEach((el,i)=>el.classList.toggle('on',i<(s.strikes||0)));
 showClock();
}
function showClock(){
 const t=s.clock||{};
 const seconds=t.running?Math.max(0,Math.ceil((t.ends-Date.now())/1000)):(t.remaining??t.duration??20);
 $('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 $('timer').classList.toggle('warning',Boolean(t.running&&seconds<=5));
}
function flash(message,wrong=false,ms=1200){
 $('overlay').textContent=message;$('overlay').className='show'+(wrong?' wrong':'');
 clearTimeout(hideOverlay);hideOverlay=setTimeout(()=>$('overlay').className='',ms);
}
function confetti(){
 const holder=$('confetti'),colors=['#fff','#ffe08a','#4faee9','#f7a7c5'];
 for(let i=0;i<85;i++){const el=document.createElement('i');el.className='bit';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%colors.length];el.style.setProperty('--drift',((Math.random()-.5)*200)+'px');holder.append(el);setTimeout(()=>el.remove(),3200)}
}
window.addEventListener('storage',e=>{
 if(e.key===key&&e.newValue){try{s={...blank(),...JSON.parse(e.newValue)};render()}catch(err){}}
 if(e.key===key+'-effect'&&e.newValue){try{const efx=JSON.parse(e.newValue);flash(efx.t,efx.x,efx.ms)}catch(err){}}
 if(e.key==='birthday-extra-vfx'&&e.newValue){try{const kind=JSON.parse(e.newValue).kind;if(kind==='win')confetti()}catch(err){}}
});
window.setInterval(showClock,150);
render();
</script></body></html>
